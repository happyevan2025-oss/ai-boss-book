<style>
/* 책상 위에 펼친 한 권의 책: 바깥은 책상(테마 따라 바뀜), 종이는 늘 종이색 */
:root {
  --desk: #3a2f27;
  --desk-2: #1f1a16;
  --desk-ink: #efe6d8;
  --desk-muted: #b3a593;
  --paper: #fbf8f2;
  --paper-edge: #efe8dc;
  --ink: #26221d;
  --ink-soft: #5d554b;
  --accent: #b5543a;
  --sage: #5f7a64;
  --rule: #e4dbcd;
  --code-bg: #f1ebe1;
  --btn: #2f2822;
  --btn-line: #5a4d42;
  color-scheme: dark;
  --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "Nanum Gothic Coding", "D2Coding", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #3a2f27; --desk-2: #1f1a16; --desk-ink: #e6dfd3; --desk-muted: #a59c8f;
    --paper: #f3eee5; --paper-edge: #e3dbcd; --btn: #2b2925; --btn-line: #4a453e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #3a2f27; --desk-2: #1f1a16; --desk-ink: #e6dfd3; --desk-muted: #a59c8f;
  --paper: #f3eee5; --paper-edge: #e3dbcd; --btn: #2b2925; --btn-line: #4a453e; color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: radial-gradient(120% 90% at 50% 40%, var(--desk) 0%, var(--desk-2) 100%);
  color: var(--desk-ink); font-family: var(--sans); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.app { height: 100%; width: 100%; min-width: 0; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; min-height: 44px; }
.bar .name { font-size: 13px; letter-spacing: .02em; color: var(--desk-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar .name b { color: var(--desk-ink); font-weight: 600; }
.btn { font: 500 13px var(--sans); color: var(--desk-ink); background: var(--btn); border: 1px solid var(--btn-line); border-radius: 999px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .4; cursor: default; }
.stage { flex: 1; min-height: 0; min-width: 0; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; position: relative; overflow: hidden; }
.nav { display: flex; align-items: center; justify-content: center; gap: 14px; padding-block: 10px 14px; }
.nav .count { font: 500 13px var(--sans); font-variant-numeric: tabular-nums; color: var(--desk-muted); min-width: 92px; text-align: center; }
.hint { font-size: 12px; color: var(--desk-muted); text-align: center; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--desk-muted); }
.loading { align-content: center; gap: 12px; }
.loading p { margin: 0; }
.precover { position: relative; height: min(72vh, 640px); aspect-ratio: 520 / 740; max-width: 80vw; overflow: hidden; border-radius: 3px; box-shadow: 0 18px 30px rgba(30,20,10,.28); }
.precover .cover h1 span { white-space: nowrap; }
@media (max-width: 520px) { .precover .cover h1 { font-size: 27px; } .precover .cover .t { top: 44px; left: 28px; right: 28px; } .precover .cover .dot { left: 28px; right: 28px; bottom: 28px; font-size: 12px; } }
.book-shadow { filter: drop-shadow(0 18px 30px rgba(30, 20, 10, .28)); }

/* ── 종이 한 장 ─────────────────────────────── */
.page { background: var(--paper); overflow: hidden; }
.page.left { background: linear-gradient(to left, var(--paper-edge) 0, var(--paper) 22px); }
.page.right { background: linear-gradient(to right, var(--paper-edge) 0, var(--paper) 22px); }
.sheet { position: relative; width: var(--L); height: var(--H); transform: scale(var(--s)); transform-origin: 0 0; color: var(--ink); }
.foot { position: absolute; bottom: 26px; left: var(--px); right: var(--px); display: flex; align-items: baseline; gap: 12px; font: 500 10px var(--sans); letter-spacing: .04em; color: #9a9083; }
.foot.right { flex-direction: row-reverse; }
.foot .num { font: 600 11px var(--sans); color: var(--ink-soft); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.foot .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.content { position: absolute; top: var(--pt); left: var(--px); width: var(--cw); height: var(--ch); overflow: hidden; }

/* 본문 글자 */
.content, .measure { font-family: var(--serif); font-size: var(--fs); line-height: 1.78; word-break: keep-all; overflow-wrap: anywhere; }
.content p, .measure p { margin: 0 0 .7em; text-align: justify; }
.content h2, .measure h2 { font: 700 1.2em/1.4 var(--sans); margin: 1.1em 0 .55em; color: var(--ink); text-wrap: balance; }
.content h3, .measure h3 { font: 600 1.02em/1.45 var(--sans); margin: .9em 0 .4em; color: var(--sage); }
.content > :first-child, .measure > :first-child { margin-top: 0; }
.content strong { font-weight: 700; }
.content code, .measure code { font-family: var(--mono); font-size: .9em; background: var(--code-bg); padding: 0 .25em; border-radius: 3px; }
.content blockquote, .measure blockquote { margin: 0 0 .8em; padding: .55em .9em; border-left: 3px solid var(--accent); background: #f6efe6; font-family: var(--sans); font-size: .93em; line-height: 1.7; }
.content blockquote p, .measure blockquote p { margin: 0; text-align: left; }
.content pre, .measure pre { margin: 0 0 .8em; padding: .7em .85em; background: var(--code-bg); border-radius: 6px; white-space: pre-wrap; font: .82em/1.65 var(--mono); }
.content pre code, .measure pre code { background: none; padding: 0; font-size: 1em; }
.li { display: grid; grid-template-columns: 1.4em minmax(0, 1fr); margin: 0 0 .45em; }
.li .mk { color: var(--accent); font-family: var(--sans); font-weight: 600; font-size: .9em; padding-top: .1em; }
.li.cont .mk { visibility: hidden; }
.li > div { min-width: 0; }
.content table, .measure table { width: 100%; border-collapse: collapse; margin: 0 0 .9em; font: .8em/1.55 var(--sans); }
.content th, .measure th { text-align: left; font-weight: 600; background: #efe7da; padding: .45em .5em; border-bottom: 1px solid var(--rule); }
.content td, .measure td { padding: .42em .5em; border-bottom: 1px solid var(--rule); vertical-align: top; word-break: keep-all; }
.fig { margin: .2em 0 .9em; }
.fig img { display: block; width: 100%; height: auto; border-radius: 4px; }
.fig.small img { width: 62%; margin: 0 auto; }
.figph { margin: 0 0 .9em; padding: .8em .9em; border: 1px dashed #c9bda9; border-radius: 6px; font: .78em/1.5 var(--sans); color: var(--ink-soft); background: #faf5ec; }
.figph b { display: block; font-weight: 600; color: var(--accent); letter-spacing: .04em; font-size: .9em; margin-bottom: .15em; }

/* 장 첫 면 */
.opener-img { position: absolute; top: 0; left: 0; width: 100%; height: 41%; object-fit: cover; }
.opener { margin-bottom: 1.2em; }
.opener .label { font: 600 .78em var(--sans); letter-spacing: .14em; color: var(--accent); }
.opener h1 { font: 700 1.62em/1.32 var(--sans); margin: .35em 0 .3em; color: var(--ink); text-wrap: balance; }
.opener .sub { font: 400 .98em/1.5 var(--serif); color: var(--ink-soft); }
.opener::after { content: ""; display: block; width: 36px; height: 2px; background: var(--accent); margin-top: 1em; }

/* 부 표지 */
.part { position: absolute; inset: 0; display: flex; flex-direction: column; }
.part .txt { padding: 60px var(--px) 26px; min-height: 30%; box-sizing: border-box; }
.part .no { font: 600 13px var(--sans); letter-spacing: .2em; color: var(--accent); }
.part h2 { font: 700 30px/1.3 var(--sans); margin: 12px 0 10px; color: var(--ink); text-wrap: balance; }
.part .range { font: 500 13px var(--sans); color: var(--ink-soft); }
.part img { flex: 1; min-height: 0; width: 100%; object-fit: cover; object-position: 50% 70%; }

/* 앞·뒤 표지 */
.cover { position: absolute; inset: 0; background: #2a2620; color: #fbf6ee; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(24,20,16,.86) 0%, rgba(24,20,16,.5) 36%, rgba(24,20,16,0) 55%, rgba(24,20,16,0) 70%, rgba(24,20,16,.78) 100%); z-index: 1; }
.cover .t { position: absolute; z-index: 2; top: 70px; left: 46px; right: 46px; }
.cover .eyebrow { font: 500 13px var(--sans); letter-spacing: .12em; color: #f0c9b6; }
.cover h1 { font: 700 40px/1.22 var(--sans); margin: 16px 0 0; letter-spacing: -.01em; text-wrap: balance; }
.cover h1 span { display: block; color: #f2a888; }
.cover .dot { position: absolute; z-index: 2; bottom: 44px; left: 46px; right: 46px; display: flex; align-items: center; gap: 12px; font: 500 14px/1.6 var(--sans); color: #fbf6ee; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.cover .dot i { width: 18px; height: 18px; border-radius: 50%; background: #c2603c; box-shadow: 0 0 0 5px rgba(194,96,60,.25); display: inline-block; }
.back { position: absolute; inset: 0; background: #2a2620; color: #f3ece1; display: flex; flex-direction: column; }
.back .t { padding: 64px 46px 28px; font: 400 16px/1.85 var(--serif); }
.back .t b { display: block; font: 700 21px/1.45 var(--sans); margin-bottom: 14px; color: #fbf6ee; }
.back img { flex: 1; min-height: 0; width: 100%; object-fit: cover; opacity: .92; }

/* 차례 면 */
.toc h2 { font: 700 24px var(--sans); margin: 0 0 22px; }
.toc .part-row { font: 600 .74em var(--sans); letter-spacing: .1em; color: var(--accent); margin: 1.1em 0 .4em; }
.toc a { display: flex; align-items: baseline; gap: 8px; color: var(--ink); text-decoration: none; padding: .26em 0; font: 500 .9em/1.45 var(--sans); }
.toc a:hover { color: var(--accent); }
.toc a .ttl { min-width: 0; }
.toc a .lead { flex: 1; border-bottom: 1px dotted #cbbfae; transform: translateY(-.3em); min-width: 12px; }
.toc a .pg { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.blank-mark { position: absolute; inset: 0; display: grid; place-items: center; }
.blank-mark i { width: 10px; height: 10px; border-radius: 50%; background: #c2603c; opacity: .35; }

.measure { position: absolute; left: -10000px; top: 0; visibility: hidden; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
@media (max-width: 520px) { .bar .name { font-size: 12px; } .hint { display: none; } }
</style>

<script>
window.__main = () => {
  const BOOK = window.BOOK;
  const stage = document.getElementById('stage');
  const PRE = (document.querySelector('.precover img') || {}).src || '';
  const measure = document.getElementById('measure');
  const countEl = document.getElementById('count');
  const LAYOUT = {
    spread: { L: 520, H: 740, pt: 56, px: 48, pb: 62, fs: 14.6 },
    single: { L: 360, H: 600, pt: 42, px: 26, pb: 54, fs: 14.4 },
  };
  const BLURB = '챗GPT에 묻고, 답을 복사해 붙여넣던 밤은 이제 그만. 내 컴퓨터의 파일을 직접 정리하고, 문서와 보고서를 만들고, 매주 알아서 일하는 AI 직원을 들이는 법을 14장에 담았습니다.';

  let state = { mode: null, pages: [], flip: null, scale: 1, tocTargets: [] };

  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const unesc = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };

  function splitTitle(raw) {
    const t = unesc(raw);
    const m = t.match(/^([^.]+)\.\s*(.*)$/);
    if (!m) return { label: '', title: t, sub: '' };
    const [title, ...rest] = m[2].split(/:\s*/);
    return { label: m[1], title: title || m[1], sub: rest.join(': ') };
  }

  // ── 블록 → HTML ─────────────────────────
  function blockHTML(b) {
    switch (b.t) {
      case 'p': return `<p>${b.html}</p>`;
      case 'h2': return `<h2>${b.html}</h2>`;
      case 'h3': return `<h3>${b.html}</h3>`;
      case 'quote': return `<blockquote><p>${b.html}</p></blockquote>`;
      case 'code': return `<pre><code>${esc(b.text)}</code></pre>`;
      case 'li': return `<div class="li${b.cont ? ' cont' : ''}"><span class="mk">${b.n ? b.n + '.' : '•'}</span><div>${b.html}</div></div>`;
      case 'figure': {
        const m = unesc(b.html).match(/^\[([^\]]+)\]\s*(.*)$/);
        return `<div class="figph"><b>${esc(m ? m[1] : '그림')} · 화면 캡처 자리</b>${esc(m ? m[2] : unesc(b.html))}</div>`;
      }
      case 'table': {
        const [head, ...rows] = b.rows;
        const th = b.noHead ? '' : `<tr>${head.map(c => `<th>${c}</th>`).join('')}</tr>`;
        const body = (b.noHead ? b.rows : rows).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
        return `<table>${th}${body}</table>`;
      }
      case 'img': return `<figure class="fig ${b.kind}"><img src="${b.src}" alt="" style="aspect-ratio:${b.w}/${b.h}" loading="lazy"></figure>`;
    }
    return '';
  }

  // HTML 문자열을 단어 단위로 나누되, 열린 태그를 이어 붙여 깨지지 않게 한다
  function tokenize(html) { return html.match(/<[^>]+>|[^<\s]+\s*|\s+/g) || []; }
  function htmlUpTo(tokens, k) {
    const stack = []; let out = '';
    for (let i = 0; i < k; i++) {
      const t = tokens[i]; out += t;
      if (/^<\//.test(t)) stack.pop(); else if (/^<(?!br)[a-z]/i.test(t) && !/\/>$/.test(t)) stack.push(t);
    }
    return { html: out + stack.slice().reverse().map(t => '</' + t.match(/^<([a-z0-9]+)/i)[1] + '>').join(''), open: stack.slice() };
  }

  // ── 쪽 나누기 ───────────────────────────
  function paginate(mode) {
    const Lc = LAYOUT[mode];
    const cw = Lc.L - Lc.px * 2, ch = Lc.H - Lc.pt - Lc.pb;
    measure.style.cssText = `width:${cw}px;height:${ch}px;box-sizing:border-box;--fs:${Lc.fs}px;overflow:hidden;`;
    const pages = [];
    const spread = mode === 'spread';
    let cur = null;

    const fits = () => measure.scrollHeight <= ch + 1;
    const newPage = (extra = {}) => { flush(); cur = { kind: 'text', html: '', run: extra.run || '', ...extra }; measure.innerHTML = ''; measure.style.paddingTop = ''; };
    const flush = () => { if (cur) { cur.html = measure.innerHTML; pages.push(cur); cur = null; } };
    const toRight = () => { flush(); if (spread && pages.length % 2 === 1) pages.push({ kind: 'blank' }); };
    const isEmpty = () => measure.childElementCount === 0 || (cur && cur.opener && measure.childElementCount === 1);

    function place(b, run) {
      const html = blockHTML(b);
      measure.insertAdjacentHTML('beforeend', html);
      const el = measure.lastElementChild;
      if (b.t === 'h2' || b.t === 'h3') {
        measure.insertAdjacentHTML('beforeend', '<p>가<br>가</p>');
        const ok = fits(); measure.lastElementChild.remove();
        if (ok) return;
        el.remove(); newPage({ run }); measure.insertAdjacentHTML('beforeend', html); return;
      }
      if (fits()) return;
      el.remove();
      if (['p', 'quote', 'li'].includes(b.t)) {
        const tokens = tokenize(b.html);
        let lo = 0, hi = tokens.length;
        while (lo < hi) {
          const mid = Math.ceil((lo + hi) / 2);
          measure.insertAdjacentHTML('beforeend', blockHTML({ ...b, html: htmlUpTo(tokens, mid).html }));
          const ok = fits(); measure.lastElementChild.remove();
          if (ok) lo = mid; else hi = mid - 1;
        }
        if (lo >= 3 && lo < tokens.length) {
          const head = htmlUpTo(tokens, lo);
          measure.insertAdjacentHTML('beforeend', blockHTML({ ...b, html: head.html }));
          const rest = head.open.join('') + tokens.slice(lo).join('');
          newPage({ run });
          place({ ...b, html: rest, cont: b.t === 'li' ? true : b.cont }, run);
          return;
        }
      }
      if (b.t === 'table' && b.rows.length > 2) {
        const head = b.noHead ? null : b.rows[0];
        const body = b.noHead ? b.rows : b.rows.slice(1);
        let n = 0;
        for (let k = 1; k <= body.length; k++) {
          measure.insertAdjacentHTML('beforeend', blockHTML({ t: 'table', noHead: !head, rows: head ? [head, ...body.slice(0, k)] : body.slice(0, k) }));
          const ok = fits(); measure.lastElementChild.remove();
          if (ok) n = k; else break;
        }
        if (n >= 1 && n < body.length) {
          measure.insertAdjacentHTML('beforeend', blockHTML({ t: 'table', noHead: !head, rows: head ? [head, ...body.slice(0, n)] : body.slice(0, n) }));
          newPage({ run });
          place({ t: 'table', noHead: !head, rows: head ? [head, ...body.slice(n)] : body.slice(n) }, run);
          return;
        }
      }
      if (b.t === 'code') {
        const lines = b.text.split('\n');
        let n = 0;
        for (let k = 1; k <= lines.length; k++) {
          measure.insertAdjacentHTML('beforeend', blockHTML({ t: 'code', text: lines.slice(0, k).join('\n') }));
          const ok = fits(); measure.lastElementChild.remove();
          if (ok) n = k; else break;
        }
        if (n >= 2 && n < lines.length) {
          measure.insertAdjacentHTML('beforeend', blockHTML({ t: 'code', text: lines.slice(0, n).join('\n') }));
          newPage({ run });
          place({ t: 'code', text: lines.slice(n).join('\n') }, run);
          return;
        }
      }
      if (isEmpty()) { measure.insertAdjacentHTML('beforeend', html); return; } // 한 면보다 큰 것은 그대로 둔다
      newPage({ run });
      place(b, run);
    }

    // 표지, 차례
    pages.push({ kind: 'cover' });
    const tocStart = pages.length;
    pages.push({ kind: 'toc', part: 0 }, { kind: 'toc', part: 1 });
    const toc = [];

    for (const sec of BOOK.sections) {
      const blocks = sec.blocks;
      let run = '';
      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        if (b.t === 'img' && b.kind === 'part') {
          toRight();
          const m = (b.caption || '').match(/^(\d+부)\.\s*(.*?)\s*\((.*)\)\s*$/);
          pages.push({ kind: 'part', src: b.src, no: m ? m[1] : '', title: m ? m[2] : b.caption, range: m ? m[3] : '' });
          toc.push({ part: true, label: m ? `${m[1]} · ${m[2]}` : b.caption, page: pages.length - 1 });
          if (spread) pages.push({ kind: 'blank' });
          continue;
        }
        if (b.t === 'h1') {
          const st = splitTitle(b.html);
          run = st.label && st.label !== st.title ? `${st.label} · ${st.title}` : st.title;
          toRight();
          let img = null;
          if (blocks[i + 1] && blocks[i + 1].t === 'img' && blocks[i + 1].kind === 'chapter') { img = blocks[i + 1]; i++; }
          const label = st.label === st.title ? '' : st.label;
          const opener = `<div class="opener"><div class="label">${esc(label)}</div><h1>${esc(st.title)}</h1>${st.sub ? `<div class="sub">${esc(st.sub)}</div>` : ''}</div>`;
          cur = { kind: 'text', run: '', opener: true, img: img ? img.src : null, html: '' };
          measure.innerHTML = '';
          if (img) measure.style.paddingTop = Math.round(Lc.H * 0.41 - Lc.pt + 26) + 'px';
          measure.insertAdjacentHTML('beforeend', opener);
          cur.padTop = measure.style.paddingTop;
          toc.push({ label: label ? `${label}  ${st.title}` : st.title, page: pages.length });
          continue;
        }
        if (!cur) newPage({ run });
        place(b, run);
      }
      flush();
      measure.style.paddingTop = '';
    }
    // 뒤표지는 왼쪽에 홀로
    if (spread && (pages.length + 1) % 2 === 1) pages.push({ kind: 'blank' });
    pages.push({ kind: 'back' });
    if (!spread) for (let i = pages.length - 1; i >= 0; i--) if (pages[i].kind === 'blank') pages.splice(i, 1), toc.forEach(t => { if (t.page > i) t.page--; });
    return { pages, toc, tocStart };
  }


  function pageHTML(p, idx, mode, toc) {
    const Lc = LAYOUT[mode];
    const side = mode === 'spread' ? (idx % 2 === 1 ? 'left' : 'right') : 'right';
    const vars = `--L:${Lc.L}px;--H:${Lc.H}px;--pt:${Lc.pt}px;--px:${Lc.px}px;--cw:${Lc.L - Lc.px * 2}px;--ch:${Lc.H - Lc.pt - Lc.pb}px;--fs:${Lc.fs}px;`;
    const foot = ttl => `<div class="foot ${side}"><span class="num">${idx}</span>${ttl ? `<span class="ttl">${esc(ttl)}</span>` : ''}</div>`;
    let inner = '';
    if (p.kind === 'cover') {
      inner = `<div class="cover" style="background:#2a2620 url(${PRE}) center/cover"><img src="images/P1_1부표지.jpg" alt=""><div class="t"><h1>사장님,<br>그 일은<span>AI에게 맡기세요</span></h1></div><div class="dot"><i></i><span>견적서부터 리뷰 답글까지,<br>Claude Code로 혼자 하던 일 덜어내기</span></div></div>`;
    } else if (p.kind === 'back') {
      inner = `<div class="back"><div class="t"><b>오늘 밤, 복사·붙여넣기를 맡길 직원이 생깁니다</b>${BLURB}</div><img src="images/EP_에필로그.jpg" alt=""></div>`;
    } else if (p.kind === 'blank') {
      inner = `<div class="blank-mark"><i></i></div>`;
    } else if (p.kind === 'part') {
      inner = `<div class="part"><div class="txt"><div class="no">${esc(p.no)}</div><h2>${esc(p.title)}</h2><div class="range">${esc(p.range)}</div></div><img src="${p.src}" alt=""></div>`;
    } else if (p.kind === 'toc') {
      const half = Math.ceil(toc.length / 2);
      const items = p.part === 0 ? toc.slice(0, half) : toc.slice(half);
      inner = `<div class="content toc">${p.part === 0 ? '<h2>차례</h2>' : '<div style="height:50px"></div>'}${items.map(t => t.part
        ? `<div class="part-row"><a href="#page-${t.page}" data-go="${t.page}" style="font:inherit;color:inherit;padding:0">${esc(t.label)}</a></div>`
        : `<a href="#page-${t.page}" data-go="${t.page}"><span class="ttl">${esc(t.label)}</span><span class="lead"></span><span class="pg">${t.page}</span></a>`).join('')}</div>${foot('')}`;
    } else {
      inner = (p.img ? `<img class="opener-img" src="${p.img}" alt="">` : '')
        + `<div class="content" style="${p.padTop ? 'padding-top:' + p.padTop + ';box-sizing:border-box;height:calc(var(--ch))' : ''}">${p.html}</div>`
        + foot(p.opener ? '' : p.run);
    }
    const hard = p.kind === 'cover' || p.kind === 'back';
    return `<div class="page ${side}"${hard ? ' data-density="hard"' : ''}><div class="sheet" style="${vars}">${inner}</div></div>`;
  }

  const stageSize = () => ({ w: Math.min(stage.clientWidth, document.documentElement.clientWidth - 32), h: stage.clientHeight });
  function pickMode() {
    const { w, h } = stageSize();
    return (w < 760 || w / h < 1.05) ? 'single' : 'spread';
  }

  function build(keepPage) {
    const mode = pickMode();
    const Lc = LAYOUT[mode];
    if (mode !== state.mode) {
      const anchor = state.pages[keepPage] && state.pages[keepPage].html ? state.pages[keepPage].html.slice(0, 60) : null;
      const res = (window.PAGES && window.PAGES[mode]) || paginate(mode);
      state.mode = mode; state.pages = res.pages; state.toc = res.toc;
      if (anchor) { const k = res.pages.findIndex(p => p.html && p.html.includes(anchor.replace(/<[^>]*$/, ''))); if (k >= 0) keepPage = k; }
      keepPage = Math.min(keepPage || 0, res.pages.length - 1);
    }
    const { w, h } = stageSize();
    const s = mode === 'spread' ? Math.min(w / (Lc.L * 2), h / Lc.H) : Math.min(w / Lc.L, h / Lc.H);
    const pw = Math.floor(Lc.L * s), ph = Math.floor(Lc.H * s);
    if (state.flip) { try { state.flip.destroy(); } catch (e) {} }
    stage.innerHTML = '';
    const holder = document.createElement('div');
    holder.className = 'book-shadow';
    const el = document.createElement('div');
    holder.appendChild(el); stage.appendChild(holder);
    el.innerHTML = state.pages.map((p, i) => pageHTML(p, i, mode, state.toc)).join('');
    el.querySelectorAll('.sheet').forEach(sh => sh.style.setProperty('--s', s));
    holder.style.width = (mode === 'spread' ? pw * 2 : pw) + 'px';
    const flip = new St.PageFlip(el, {
      width: pw, height: ph, size: 'stretch', minWidth: Math.floor(pw * (mode === 'single' ? .8 : .5)), maxWidth: pw, minHeight: Math.floor(ph * .5), maxHeight: ph, autoSize: true,
      showCover: true, usePortrait: mode === 'single',
      maxShadowOpacity: .45, flippingTime: 750, mobileScrollSupport: false, disableFlipByClick: true,
      startPage: Math.max(0, keepPage || 0), swipeDistance: 24, showPageCorners: true,
    });
    flip.loadFromHTML(el.querySelectorAll('.page'));
    flip.on('flip', e => update(e.data));
    el.addEventListener('click', e => {
      const a = e.target.closest('[data-go]');
      if (a) { e.preventDefault(); flip.flip(+a.dataset.go); }
    });
    state.flip = flip; state.scale = s;
    update(flip.getCurrentPageIndex());
  }

  function update(i) {
    const n = state.pages.length - 1;
    countEl.textContent = `${i} / ${n}쪽`;
    document.getElementById('prev').disabled = i <= 0;
    document.getElementById('next').disabled = i >= n;
    try { history.replaceState(null, '', '#page-' + i); } catch (e) {}
  }

  document.getElementById('prev').onclick = () => state.flip && state.flip.flipPrev();
  document.getElementById('next').onclick = () => state.flip && state.flip.flipNext();
  document.getElementById('tocBtn').onclick = () => state.flip && state.flip.flip(1);
  document.addEventListener('keydown', e => {
    if (!state.flip) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') state.flip.flipNext();
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') state.flip.flipPrev();
  });
  let rt = null, lastW = 0, lastH = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const w = stage.clientWidth, h = stage.clientHeight;
      if (Math.abs(w - lastW) < 24 && Math.abs(h - lastH) < 24) return;
      lastW = w; lastH = h;
      build(state.flip ? state.flip.getCurrentPageIndex() : 0);
    }, 250);
  });

  const start = () => {
    lastW = stage.clientWidth; lastH = stage.clientHeight;
    const m = location.hash.match(/^#page-(\d+)$/);
    build(m ? +m[1] : 0);
  };
  const cssReady = new Promise(r => { const l = document.getElementById('fontcss'); if (!l || l.dataset.ok) return r(); l.addEventListener('load', () => setTimeout(r, 0)); l.addEventListener('error', r); setTimeout(r, 4000); });
  const fontsReady = cssReady.then(() => document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3500))]) : Promise.resolve());
  // 측정용으로 쓰는 글꼴을 먼저 불러온다
  measure.innerHTML = '<p>가나다 <strong>가</strong> <code>a</code></p><h2>가</h2>';
  if (window.PAGES && !/dump/.test(location.search)) { start(); return; }
  fontsReady.then(() => (document.fonts ? Promise.all(['400 15px "Noto Serif KR"', '700 15px "Noto Serif KR"', '600 15px "IBM Plex Sans KR"', '700 15px "IBM Plex Sans KR"', '15px "Nanum Gothic Coding"'].map(f => document.fonts.load(f, '가a').catch(() => {}))) : null)).then(() => {
    if (/dump/.test(location.search)) {
      const out = { spread: paginate('spread'), single: paginate('single') };
      const pre = document.createElement('pre'); pre.id = 'dump'; pre.textContent = JSON.stringify(out);
      document.body.innerHTML = ''; document.body.appendChild(pre); return;
    }
    start();
  });
};
</script>
<script>
// 첫 화면(표지)을 먼저 완성해 두고, 무거운 파일은 페이지가 다 뜬 뒤에 불러온다
(() => {
  const css = (href) => { const l = document.createElement('link'); l.id = 'fontcss'; l.rel = 'stylesheet'; l.href = href; l.onload = l.onerror = () => { l.dataset.ok = 1; }; document.head.appendChild(l); };
  const js = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.body.appendChild(s); });
  const go = () => setTimeout(() => {
    css('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic+Coding&family=Noto+Serif+KR:wght@400;600;700&display=swap');
    const dump = /dump/.test(location.search);
    Promise.all([js('https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js'), js(dump ? 'book.js' : 'pages.js')]).then(() => window.__main());
  }, 1200);
  if (document.readyState === 'complete') go(); else addEventListener('load', go);
})();
</script>

</body></html>
